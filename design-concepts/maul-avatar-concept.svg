<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 352" role="img" aria-labelledby="title desc">
  <title id="title">Maul avatar visual design exploration</title>
  <desc id="desc">A transparent vector study of a compact red horned office avatar with black facial markings, amber eyes, a charcoal tunic, and a violet research book badge.</desc>
  <defs>
    <linearGradient id="skin" x1="0.18" y1="0.08" x2="0.82" y2="0.94">
      <stop offset="0" stop-color="#ed4b56" />
      <stop offset="0.48" stop-color="#c92d3d" />
      <stop offset="1" stop-color="#941e2d" />
    </linearGradient>
    <linearGradient id="skinSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d63a48" />
      <stop offset="1" stop-color="#8f1b2a" />
    </linearGradient>
    <linearGradient id="marking" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#25252c" />
      <stop offset="1" stop-color="#12151a" />
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4652" />
      <stop offset="0.52" stop-color="#27313c" />
      <stop offset="1" stop-color="#1a222b" />
    </linearGradient>
    <linearGradient id="clothEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#505d6a" />
      <stop offset="1" stop-color="#29333e" />
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f0ecda" />
      <stop offset="0.62" stop-color="#b8b5a6" />
      <stop offset="1" stop-color="#77766f" />
    </linearGradient>
    <linearGradient id="boot" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3b4654" />
      <stop offset="1" stop-color="#151c25" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7be8" />
      <stop offset="1" stop-color="#6346ad" />
    </linearGradient>
    <radialGradient id="eye" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#ffe9a0" />
      <stop offset="0.55" stop-color="#d6a344" />
      <stop offset="1" stop-color="#9b641c" />
    </radialGradient>
  </defs>

  <!-- Rounded boots and legs keep the same compact footprint as the production family. -->
  <path d="M139 260c-2 14-5 31-4 46l-18 13c-6 5-4 15 4 17h49c7 0 10-8 6-14l-15-21 4-39z" fill="url(#cloth)" stroke="#151a22" stroke-width="3" />
  <path d="M213 260c2 14 5 31 4 46l18 13c6 5 4 15-4 17h-49c-7 0-10-8-6-14l15-21-4-39z" fill="url(#cloth)" stroke="#151a22" stroke-width="3" />
  <path d="M116 310c-6 5-5 14 3 17 11 5 37 6 57 3 7-1 10-9 6-14l-16-19c-10 7-22 11-36 10z" fill="url(#boot)" stroke="#10161d" stroke-width="3" />
  <path d="M236 310c6 5 5 14-3 17-11 5-37 6-57 3-7-1-10-9-6-14l16-19c10 7 22 11 36 10z" fill="url(#boot)" stroke="#10161d" stroke-width="3" />
  <path d="M118 319c12 4 42 5 59 1M234 319c-12 4-42 5-59 1" fill="none" stroke="#576577" stroke-width="2" opacity=".7" />

  <!-- Compact tunic and arms. -->
  <path d="M124 183c7-15 20-23 33-27h38c13 4 26 12 33 27l-4 78c-18 11-72 11-90 0z" fill="url(#cloth)" stroke="#161d25" stroke-width="3" />
  <path d="M139 188c8 7 17 10 24 11l-5 59M213 188c-8 7-17 10-24 11l5 59" fill="none" stroke="#566373" stroke-width="3" opacity=".48" />
  <path d="M132 247c20 9 68 9 88 0l-4 20c-19 9-61 9-80 0z" fill="#1c252e" opacity=".9" />
  <path d="M157 158h38l-5 23c-7 4-21 4-28 0z" fill="#202831" stroke="#121820" stroke-width="3" />
  <path d="M126 187c-11 5-18 14-24 27l13 34c4 8 14 10 20 3l10-14-7-20 13-19z" fill="url(#clothEdge)" stroke="#161d25" stroke-width="3" />
  <path d="M226 187c11 5 18 14 24 27l-13 34c-4 8-14 10-20 3l-10-14 7-20-13-19z" fill="url(#clothEdge)" stroke="#161d25" stroke-width="3" />
  <path d="M105 239c-5 6-3 14 4 17 7 3 15 1 19-6l8-13-14-10z" fill="#202832" stroke="#11171f" stroke-width="3" />
  <path d="M247 239c5 6 3 14-4 17-7 3-15 1-19-6l-8-13 14-10z" fill="#202832" stroke="#11171f" stroke-width="3" />

  <!-- Violet research badge. -->
  <rect x="166" y="202" width="20" height="20" rx="5" fill="url(#violet)" stroke="#bca8fa" stroke-width="1.5" />
  <path d="M171 207h10v10h-10zM172 208v8M177 208v8M181 208v8" fill="none" stroke="#f4f0ff" stroke-width="1.4" />

  <!-- Horns sit behind the head and stay inside the transparent safe frame. -->
  <path d="M123 99c-12-10-17-25-13-37 2-6 8-7 12-2l12 17-4 22z" fill="url(#horn)" stroke="#67665f" stroke-width="3" />
  <path d="M229 99c12-10 17-25 13-37-2-6-8-7-12-2l-12 17 4 22z" fill="url(#horn)" stroke="#67665f" stroke-width="3" />
  <path d="M146 64c-4-14-1-28 8-38 4-4 10-2 11 4l1 25-10 17z" fill="url(#horn)" stroke="#67665f" stroke-width="3" />
  <path d="M206 64c4-14 1-28-8-38-4-4-10-2-11 4l-1 25 10 17z" fill="url(#horn)" stroke="#67665f" stroke-width="3" />
  <path d="M176 57c-3-13 0-27 7-37 4-5 10-3 11 3l-1 29-8 14z" fill="url(#horn)" stroke="#67665f" stroke-width="3" />

  <!-- Red head with a slightly softened toy-like silhouette. -->
  <path d="M111 105c0-34 25-59 65-64 40 5 65 30 65 64v50c0 31-26 54-65 57-39-3-65-26-65-57z" fill="url(#skin)" stroke="#791b29" stroke-width="4" />
  <path d="M116 109c2-27 16-46 35-56-12 18-16 38-14 59 2 25 0 48-12 60-7-9-10-19-9-33z" fill="#f45e65" opacity=".28" />
  <path d="M236 109c-2-27-16-46-35-56 12 18 16 38 14 59-2 25 0 48 12 60 7-9 10-19 9-33z" fill="#731826" opacity=".2" />

  <!-- Broad photo-specific tattoo relationships: a central field with paired curves. -->
  <path d="M170 48l6 13-7 30-10 17-11-14 9-25zM182 48l-6 13 7 30 10 17 11-14-9-25z" fill="url(#marking)" />
  <path d="M151 77c-9 5-18 12-23 22l13 8 10-8 12-5zM201 77c9 5 18 12 23 22l-13 8-10-8-12-5z" fill="url(#marking)" />
  <path d="M147 111c-10 0-19 5-25 13l10 9 15-5 12-10zM205 111c10 0 19 5 25 13l-10 9-15-5-12-10z" fill="url(#marking)" />
  <path d="M174 100l4 20-8 19-9 7-6-10 12-15zM178 100l-4 20 8 19 9 7 6-10-12-15z" fill="url(#marking)" />
  <path d="M125 145l22 3 10 13-14 8-17-9zM227 145l-22 3-10 13 14 8 17-9z" fill="url(#marking)" />
  <path d="M165 157l11 6-5 24-9 7-5-12zM187 157l-11 6 5 24 9 7 5-12z" fill="url(#marking)" />

  <!-- Eye sockets, amber irises, nose and closed mouth. -->
  <path d="M126 126c12-13 28-14 43-3l-8 20c-14 5-26 1-35-7z" fill="#11151a" />
  <path d="M226 126c-12-13-28-14-43-3l8 20c14 5 26 1 35-7z" fill="#11151a" />
  <ellipse cx="153" cy="133" rx="7" ry="8" fill="url(#eye)" stroke="#f0c967" stroke-width="1.5" />
  <ellipse cx="199" cy="133" rx="7" ry="8" fill="url(#eye)" stroke="#f0c967" stroke-width="1.5" />
  <path d="M153 127v12M199 127v12" stroke="#2a1b0e" stroke-width="2.5" />
  <path d="M176 131l-10 25 10 8 10-8z" fill="#d93a47" stroke="#8e1b2b" stroke-width="2" />
  <path d="M176 157l-8 11 8 7 8-7z" fill="#e34b54" />
  <path d="M159 181c8 5 26 5 34 0-2 10-9 15-17 15s-15-5-17-15z" fill="#14171c" />
  <path d="M169 185h14" stroke="#5b1c28" stroke-width="2" />
  <path d="M172 198v8M180 198v8" stroke="#ed4b56" stroke-width="3" stroke-linecap="round" />

  <!-- Small satin highlights keep the study in the same softly rendered family. -->
  <path d="M137 91c7-10 15-17 24-21" fill="none" stroke="#ff8b8c" stroke-width="4" stroke-linecap="round" opacity=".34" />
  <path d="M144 224c-6 8-9 16-11 24M208 224c6 8 9 16 11 24" fill="none" stroke="#7c8996" stroke-width="3" stroke-linecap="round" opacity=".35" />
</svg>
